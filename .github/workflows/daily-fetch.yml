name: Daily Auto Fetch Documents

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存関係のインストール
        run: npm ci

      - name: 自動収集スクリプトの実行
        run: npx tsx scripts/auto-fetch-all.ts

      - name: 変更があった場合に自動コミット＆プッシュ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "新しいデータの追加はありませんでした。"
          else
            git commit -m "Auto: Update documents via Daily GitHub Action"
            git push
          fi